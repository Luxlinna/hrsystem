name: Supabase Database Backup to AWS S3

on:
  schedule:
    # Runs every day at 02:00 UTC (09:00 AM Cambodia / ICT)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      backup_label:
        description: 'Optional manual backup label/tag (e.g. pre-migration, v2-release)'
        required: false
        default: 'manual'

jobs:
  backup-to-s3:
    name: Backup Supabase Database & Upload to AWS S3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Database Backup to AWS S3
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_PUBLIC_SUPABASE_URL || 'https://blcvtbzwpwmqkphlcjji.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          VITE_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.VITE_PUBLIC_SUPABASE_ANON_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BACKUP_BUCKET || secrets.AWS_S3_BUCKET || 'hrsystem-ops' }}
          AWS_S3_REGION: ${{ secrets.AWS_S3_REGION || 'us-east-1' }}
          BACKUP_TAG: ${{ github.event.inputs.backup_label || 'daily' }}
        run: node scripts/backup-db-to-s3.mjs
